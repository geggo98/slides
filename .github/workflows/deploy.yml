name: Deploy Slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: devenv

      # Pinned to the exact devenv build this machine's local nix-darwin setup
      # uses (`devenv version` -> 2.2.2+b8030c5) and to devenv.yaml's module
      # input, both by commit rev rather than a movable tag: a floating
      # `nixpkgs#devenv` install drifted past the devenv.yaml module pin
      # (v2.2.2) sometime between 2026-09-20 and 2026-09-24, breaking the
      # build with a Nix eval error unrelated to any change in this repo.
      # Confirmed this exact rev is prebuilt and signed on devenv.cachix.org
      # (the cache the step above already trusts), so this is a fast fetch,
      # not a from-source Rust build.
      - name: Install devenv
        shell: bash
        run: nix profile add "github:cachix/devenv/b8030c58deafc013fc51791377fe8fea4dadcb00#devenv" # v2.2.2

      - name: Build all presentations
        run: |
          export SLIDES_BASE_PATH="${{ github.event.repository.name }}"
          devenv tasks run slides

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
